version: 2
# Commit messages are Conventional Commits (CONTRIBUTING.md#commit-messages):
# a runtime dependency or base image update is a fix, so it makes a patch
# release with rebuilt images; a development or CI update makes none.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    # Majors that need a migration, done by hand: Next.js 16, TypeScript 7,
    # and Node's types, which follow the Node the images run (24).
    # Transformers.js stays on 3 while kokoro-js (1.2.1, the latest) requires
    # ^3.5.1: the renderer sets `env.cacheDir` on the copy kokoro-js loads,
    # so both must resolve to the same one.
    ignore:
      - dependency-name: "@huggingface/transformers"
        update-types: [version-update:semver-major]
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
      include: scope
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: fix
      include: scope
    # Node 26 no longer ships corepack, which the images enable pnpm with:
    # the images stay on Node 24 LTS.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]

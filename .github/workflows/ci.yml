name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    env:
      SKIP_ENV_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: pnpm test
      - run: pnpm build

  # Commit messages follow Conventional Commits (CONTRIBUTING.md#commit-messages):
  # release.yml reads them to choose each version. Only the commits a push or
  # a pull request adds are checked, never those before v0.2.0, which are
  # prose; a pull request's title too, which a squash merge makes the commit.
  commits:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the commit messages
        env:
          FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          from="$FROM"
          # A new branch or a rewritten history: nothing to compare with.
          if ! git cat-file -e "$from^{commit}" 2>/dev/null; then from=""; fi
          if [ -n "$from" ] && git rev-parse -q --verify refs/tags/v0.2.0 >/dev/null \
            && git merge-base --is-ancestor "$from" v0.2.0; then
            from=v0.2.0
          fi
          if [ -n "$from" ]; then
            pnpm exec commitlint --from "$from" --to "$TO" --verbose
          else
            pnpm exec commitlint --last --verbose
          fi
      - name: Check the pull request's title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | pnpm exec commitlint --verbose

  # The browser edition (site/): build it (the build fails on server code in the
  # bundle), then the Playwright smoke test against the built site.
  site-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm site:build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm site:test
        env:
          CI: "1"
      # A real render in headless Chromium: no GPU here, so the voices run in
      # WebAssembly and the audio is Opus, Linux Chromium having no AAC
      # encoder. ffprobe checks the MP4. The browser profile keeps the 92 MB
      # of Kokoro weights in its Cache Storage: cached here, it downloads once
      # per Playwright version and renderer settings.
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - id: models
        run: echo "versions=$(node scripts/model-cache-key.mjs)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/troupe-render-profile
          key: render-profile-${{ runner.os }}-${{ steps.models.outputs.versions }}-${{ hashFiles('site/src/render/config.ts') }}
      - run: pnpm site:test:render
        env:
          CI: "1"
          HEADLESS: "1"
          RENDER_CHANNEL: chromium
          RENDER_PROFILE: ${{ runner.temp }}/troupe-render-profile
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: site-smoke-report
          path: |
            site/playwright-report
            site/test-results

  # The whole product in Docker (pnpm e2e:docker): every image built from this
  # checkout, the stack started, then the studio's full flow in Chromium (chat
  # on a small Ollama model, render, export, download), the CLI in its
  # container and the browser edition served by the `web` service. Images are
  # cached by BuildKit in the Actions cache, model downloads by actions/cache.
  # Timings: docs/SELF-HOSTING.md#testing-the-stack.
  docker-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      E2E_OLLAMA_MODEL: qwen2.5:0.5b
      # Ignored by git and by every image's build context.
      E2E_CACHE_DIR: ${{ github.workspace }}/.cache/e2e
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - uses: docker/setup-buildx-action@v3
      - name: Build the images
        uses: docker/bake-action@v6
        with:
          source: .
          files: |
            docker-compose.yml
            docker-compose.test.yml
          targets: app,renderer,ollama,web,cli
          load: true
          set: |
            app.cache-from=type=gha,scope=e2e-app
            app.cache-to=type=gha,scope=e2e-app,mode=max
            renderer.cache-from=type=gha,scope=e2e-renderer
            renderer.cache-to=type=gha,scope=e2e-renderer,mode=max
            ollama.cache-from=type=gha,scope=e2e-ollama
            ollama.cache-to=type=gha,scope=e2e-ollama,mode=max
            web.cache-from=type=gha,scope=e2e-web
            web.cache-to=type=gha,scope=e2e-web,mode=max
            cli.cache-from=type=gha,scope=e2e-cli
            cli.cache-to=type=gha,scope=e2e-cli,mode=max
      # The chat model (about 400 MB), Kokoro's weights for the renderer and
      # for the browser edition's render (about 90 MB each).
      - id: models
        run: echo "versions=$(node scripts/model-cache-key.mjs)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ${{ github.workspace }}/.cache/e2e/ollama
            ${{ github.workspace }}/.cache/e2e/kokoro
            ${{ github.workspace }}/.cache/e2e/render-profile
          key: e2e-models-${{ env.E2E_OLLAMA_MODEL }}-${{ steps.models.outputs.versions }}-${{ hashFiles('site/src/render/config.ts', 'ollama/Dockerfile') }}
          restore-keys: e2e-models-${{ env.E2E_OLLAMA_MODEL }}-
      - run: pnpm e2e:docker
        env:
          CI: "1"
          E2E_SKIP_BUILD: "1"
          HEADLESS: "1"
          RENDER_CHANNEL: chromium
          RENDER_PROFILE: ${{ github.workspace }}/.cache/e2e/render-profile
      # Containers wrote some of the cached files as their own users.
      - if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$E2E_CACHE_DIR"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-e2e-report
          path: |
            e2e/test-results
            e2e/playwright-report

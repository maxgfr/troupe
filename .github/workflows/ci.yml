name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: pnpm test
      - run: pnpm build

  # The static demo (site/): build it (the build fails on server code in the
  # bundle), then the Playwright smoke test against the built site.
  site-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm site:build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm site:test
        env:
          CI: "1"
      # A real render in headless Chromium: no GPU here, so the voices run in
      # WebAssembly and the audio is Opus, Linux Chromium having no AAC
      # encoder. ffprobe checks the MP4. The browser profile keeps the 92 MB
      # of Kokoro weights in its Cache Storage: cached here, it downloads once
      # per Playwright version and renderer settings.
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/troupe-render-profile
          key: render-profile-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'site/src/render/config.ts') }}
      - run: pnpm site:test:render
        env:
          CI: "1"
          HEADLESS: "1"
          RENDER_CHANNEL: chromium
          RENDER_PROFILE: ${{ runner.temp }}/troupe-render-profile
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: site-smoke-report
          path: |
            site/playwright-report
            site/test-results

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack from this checkout
        run: |
          printf 'POSTGRES_PASSWORD=%s\nTROUPE_VERSION=ci\n' "$(openssl rand -hex 16)" > .env
          docker compose up -d --build --wait --wait-timeout 300
      - name: Health check answers
        run: curl --fail --silent http://127.0.0.1:3100/api/health | grep -q '"ok":true'
      - name: An access code was generated and printed
        run: docker compose logs app | grep -q "protected by an access code"
      - name: A spoofed localhost Host header gets nothing
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: localhost:3100' 'http://127.0.0.1:3100/api/trpc/identity.myWorkspaces')
          echo "status=$status"
          test "$status" = "401"
      - name: Data survives a restart
        run: |
          code=$(docker compose exec -T app cat /app/data/access-code)
          docker compose restart app
          docker compose up -d --wait --wait-timeout 120
          test "$(docker compose exec -T app cat /app/data/access-code)" = "$code"
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

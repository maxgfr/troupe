name: images

# Publishes the stack's images for one Troupe version, for amd64 and arm64:
# ghcr.io/<owner>/troupe (the studio) and troupe-renderer, troupe-ollama,
# troupe-web and troupe-cli, the images docker-compose.yml runs. Each is
# built from the version's tag, tagged X.Y.Z, X.Y, X and latest, and given
# the version as TROUPE_VERSION (scripts/release-version.mjs).
#
# - release.yml calls it once semantic-release has published a version: the
#   tag it pushes with GITHUB_TOKEN starts no workflow of its own;
# - a v* tag pushed by hand publishes that tag;
# - "Run workflow" publishes a version whose tag exists, e.g. to rebuild it.
on:
  workflow_call:
    inputs:
      version:
        description: The version to publish, e.g. 1.2.3; its tag v1.2.3 must exist.
        required: true
        type: string
      latest:
        description: Move the latest tag to it too.
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      version:
        description: The version to publish, e.g. 1.2.3; its tag v1.2.3 must exist.
        required: true
        type: string
      latest:
        description: Move the latest tag to it too (leave it off when rebuilding an older version).
        type: boolean
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      latest: ${{ steps.version.outputs.latest }}
    steps:
      # A tag push has no inputs: its name is the version.
      - id: version
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          LATEST: ${{ inputs.latest }}
        run: |
          version="${VERSION#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::\"$VERSION\" is not a version such as 1.2.3."
            exit 1
          fi
          # A pre-release never becomes latest.
          latest=true
          if [[ "$version" == *-* || "$LATEST" == "false" ]]; then latest=false; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

  # Each platform builds on its own runner, natively. Under QEMU, arm64's
  # Node.js could crash mid-install and leave the job hanging for hours, and
  # one runner building both platforms ran out of disk on the Ollama image.
  # Each build is pushed by digest; the merge job tags the multi-platform image.
  image:
    needs: version
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
        image:
          - name: troupe
            license: MIT
            file: Dockerfile
            context: .
            target: ""
          - name: troupe-renderer
            license: GPL-3.0-or-later
            file: renderer/Dockerfile
            context: .
            target: renderer
          - name: troupe-ollama
            license: MIT
            file: ollama/Dockerfile
            context: ollama
            target: ""
          - name: troupe-web
            license: GPL-3.0-or-later
            file: site/Dockerfile
            context: .
            target: ""
          - name: troupe-cli
            license: MIT
            file: cli/Dockerfile
            context: .
            target: ""
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/v${{ needs.version.outputs.version }}
          persist-credentials: false
      # The official Ollama image, CUDA included, barely fits next to the
      # runner's preinstalled toolchains.
      - name: Free disk space
        if: matrix.image.name == 'troupe-ollama'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          # The revision label is the tag's commit, not the workflow's.
          context: git
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
          # The image's own license (the Dockerfiles' LABEL), not the
          # repository's: the renderer and the site carry the GPL as a whole.
          labels: org.opencontainers.image.licenses=${{ matrix.image.license }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          platforms: linux/${{ matrix.platform.arch }}
          build-args: TROUPE_VERSION=${{ needs.version.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,scope=release-${{ matrix.image.name }}-${{ matrix.platform.arch }},mode=max
      - name: Keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          # The name last: digests-*-troupe must not match troupe-web's.
          name: digests-${{ matrix.platform.arch }}-${{ matrix.image.name }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # One multi-platform image per name from its two digests, tagged X.Y.Z,
  # X.Y, X and latest.
  merge:
    needs: [version, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        name: [troupe, troupe-renderer, troupe-ollama, troupe-web, troupe-cli]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*-${{ matrix.name }}
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.version.outputs.version }}
            type=raw,value=latest,enable=${{ needs.version.outputs.latest == 'true' }}
      - name: Tag the multi-platform image
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # One digest per platform, no more.
          set -- *
          echo "$@"
          test "$#" -eq 2
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$VERSION"

# The script chat's Ollama on an NVIDIA GPU (the NVIDIA Container Toolkit must
# be installed). Laid over docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --wait --build ollama
#
# It runs the official Ollama image, with its CUDA libraries (about 7 GB), as
# ollama/Dockerfile's `gpu` target: the same pinned version as the CPU image.
# The models stay in the same volume. Docker on a Mac has no GPU: there, run
# Ollama natively and point OLLAMA_URL at http://host.docker.internal:11434
# (docs/SELF-HOSTING.md).
services:
  ollama:
    image: troupe-ollama-gpu:local
    pull_policy: build
    build:
      context: ollama
      target: gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

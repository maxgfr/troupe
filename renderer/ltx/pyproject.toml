[project]
name = "troupe-ltx"
version = "0.1.0"
description = "Troupe renderer's opt-in AI video mode: LTX-Video through diffusers."
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.6",
  "diffusers>=0.35",
  "transformers>=4.51",
  "accelerate>=1.6",
  "sentencepiece>=0.2",
  "huggingface-hub>=0.30",
  "protobuf>=7.36.2",
]

[tool.uv]
package = false

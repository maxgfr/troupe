<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Troupe — open-source video studio</title>
    <meta name="description" content="A personal, open-source studio for short AI videos: write the script, cast an actor, pick a model, render. Try it in your browser." />
    <link rel="icon" href="../public/favicon.ico" />
    <script type="module" src="/src/landing.ts"></script>
  </head>
  <body class="min-h-dvh">
    <main class="hero-rise mx-auto flex min-h-dvh max-w-3xl flex-col justify-center px-6 py-16 sm:px-8">
      <h1 class="font-display text-[clamp(3.5rem,14vw,6rem)] font-bold lowercase leading-none tracking-[-0.03em]">
        tr<span class="relative inline-block">o<span aria-hidden="true" class="absolute -inset-x-[0.08em] -inset-y-[0.02em] rounded-full border-[0.06em] border-spot"></span></span>upe
      </h1>
      <p class="mt-6 max-w-[34ch] text-pretty text-xl leading-snug text-fg sm:text-2xl">
        A personal studio for short AI videos: write the script, cast an actor, choose a model, render.
      </p>
      <p class="mt-3 max-w-[60ch] text-pretty text-sm text-muted">
        Open source. The studio runs entirely in your browser and keeps everything on this device;
        <a href="https://github.com/maxgfr/troupe/blob/main/docs/SELF-HOSTING.md" class="underline underline-offset-4 transition-colors duration-150 hover:text-fg">host it yourself</a>
        to use cloud models and your own GPU.
      </p>
      <div class="mt-10 flex flex-wrap items-center gap-x-6 gap-y-4">
        <a href="./app/" class="rounded-lg bg-primary px-5 py-2.5 text-sm font-semibold text-on-primary transition-opacity duration-150 hover:opacity-90">Open the app</a>
        <a href="https://github.com/maxgfr/troupe" class="inline-block py-2.5 text-sm text-muted underline-offset-4 transition-colors duration-150 hover:text-fg hover:underline">Source on GitHub ↗</a>
      </div>
    </main>
  </body>
</html>
